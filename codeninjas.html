<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Ninjas - MyCard Token Portal</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 0 !important; /* Force non-rounded sharp corners everywhere */
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 20px;
    }

    .main-container {
      max-width: 500px;
      margin: 20px auto;
      background: #121212;
      border: 3px solid #e61c24;
      padding: 25px;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #333333;
      padding-bottom: 15px;
    }

    .header-logo h1 {
      color: #ffffff;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-logo h1 span {
      color: #e61c24;
    }

    .header-logo p {
      margin-top: 5px;
      color: #aaaaaa;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
      color: #e61c24;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      background-color: #ffffff;
      color: #000000;
      border: 2px solid #cccccc;
      font-size: 15px;
      font-weight: bold;
      display: block;
      appearance: auto; /* Restores standard native browser dropdown rendering */
      -webkit-appearance: select;
    }

    select option {
      background-color: #ffffff;
      color: #000000;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #e61c24;
    }

    .ninja-btn {
      width: 100%;
      padding: 14px;
      background-color: #e61c24;
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 25px;
      letter-spacing: 1px;
    }

    .ninja-btn:hover {
      background-color: #b31218;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      font-weight: bold;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .status-box.success {
      background-color: #003300;
      color: #00ff00;
      border: 1px solid #00ff00;
    }

    .status-box.error {
      background-color: #330000;
      color: #ff3333;
      border: 1px solid #ff3333;
    }

    @media (max-width: 768px) {
      .main-container {
        width: 100%;
        margin: 0 auto;
        padding: 15px;
      }
      .ninja-btn {
        padding: 18px;
        font-size: 18px;
      }
      input[type="text"], input[type="number"], select {
        padding: 12px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="header-logo">
      <h1>CODE NINJAS <span>// MYCARD</span></h1>
      <p>SENSEI TOKEN REWARD TERMINAL</p>
    </div>

    <form id="reward-form">
      <label for="ninja-card">Ninja Card Number</label>
      <input type="text" id="ninja-card" placeholder="ENTER CARD #" required>

      <label for="ninja-location">Dojo Location</label>
      <select id="ninja-location" required>
        <option value="Main Dojo">Main Dojo</option>
        <option value="Robotics Arena">Robotics Area</option>
        <option value="Sensei Station 2">Sensei Station</option>
      </select>

      <label for="token-amount">Tokens Amount (+)</label>
      <input type="number" id="token-amount" placeholder="0" min="1" step="1" required>

      <label for="reward-reason">Award Reason</label>
      <select id="reward-reason" required>
        <option value="Belt Promotion">Belt Promotion</option>
        <option value="Belt Stripe Earned">Belt Stripe Earned</option>
        <option value="Completed STEM Challenge">Completed STEM Challenge</option>
        <option value="Completed Coding Level">Completed Coding Level</option>
      </select>

      <button type="submit" class="ninja-btn">AWARD TOKENS</button>
    </form>

    <div id="status-box" class="status-box"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbhOweEMmxYrlXiIlC830xKxbISfbqYSg",
      authDomain: "james-allied---mycard.firebaseapp.com",
      projectId: "james-allied---mycard",
      storageBucket: "james-allied---mycard.firebasestorage.app",
      messagingSenderId: "632988788605",
      appId: "1:632988788605:web:c5cbfc6b1be3c10002ce14",
      measurementId: "G-3K908YRJ79"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById('reward-form');
    const statusBox = document.getElementById('status-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.style.display = 'none';
      statusBox.className = 'status-box';

      const card = document.getElementById('ninja-card').value.trim();
      const amount = Math.abs(parseFloat(document.getElementById('token-amount').value));
      const location = document.getElementById('ninja-location').value;
      const reason = document.getElementById('reward-reason').value;

      try {
        const freezeSnap = await get(ref(db, `cards/${card}/isFrozen`));
        if (freezeSnap.exists() && freezeSnap.val() === true) {
          throw new Error("Cannot deposit tokens: Card is currently frozen.");
        }

        const targetRef = ref(db, `transactions/${card}`);
        await push(targetRef, {
          amount: amount,
          description: `Reward: ${reason}`,
          location: location,
          timestamp: Date.now()
        });

        statusBox.textContent = `SUCCESS: ADDED ${amount} TOKENS TO CARD #${card}`;
        statusBox.classList.add('success');
        statusBox.style.display = 'block';

        form.reset();
      } catch (err) {
        statusBox.textContent = `ERROR: ${err.message || "Failed to issue tokens."}`;
        statusBox.classList.add('error');
        statusBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
